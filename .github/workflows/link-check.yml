name: link-check

on:
  schedule:
    - cron: '41 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check links
        id: check
        continue-on-error: true
        run: node .github/scripts/check-links.mjs > link-report.md
      - name: Open or update issue
        if: steps.check.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const report = fs.readFileSync('link-report.md', 'utf8');
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = `The scheduled link check found problems.\n\n${report}\n\n---\n\nRun: ${runUrl}\n\nFix the entries or comment here if a site is blocking bots.`;
            const {data: open} = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'link-check',
              per_page: 1,
            });
            if (open.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: open[0].number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: 'Scheduled link check failed',
                body,
                labels: ['link-check'],
              });
            }
      - name: Show report
        if: always()
        run: cat link-report.md
      - name: Fail on broken links
        if: steps.check.outcome == 'failure'
        run: exit 1
